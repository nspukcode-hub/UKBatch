name: Release

# Publishes the UKBatch package family to nuget.org, creates the matching GitHub release, and
# then publishes the server container image to GitHub Container Registry.
# Triggered by pushing a version tag (e.g. `git push origin v0.1.0-alpha`).
#
# Authentication uses nuget.org Trusted Publishing: the job exchanges its GitHub OIDC token
# for a short-lived NuGet API key via NuGet/login, so no long-lived secret is stored anywhere.
# The trust policy on nuget.org pins this repository and this workflow file by name.

on:
  push:
    tags: ['v*']

permissions:
  contents: write  # create the GitHub release
  id-token: write  # mint the OIDC token exchanged for a temporary NuGet API key

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The version's single source of truth is Directory.Build.props; the tag is only the
      # trigger. If they do not match exactly, fail before building anything so a stale props
      # file can never publish under a mismatched tag.
      - name: Verify tag matches Directory.Build.props version
        run: |
          prefix=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)
          suffix=$(sed -n 's:.*<VersionSuffix>\(.*\)</VersionSuffix>.*:\1:p' Directory.Build.props)
          if [ -z "$prefix" ]; then
            echo "::error::VersionPrefix not found in Directory.Build.props"
            exit 1
          fi
          version="$prefix"
          [ -n "$suffix" ] && version="$prefix-$suffix"
          expected_tag="v$version"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match Directory.Build.props version '$version' (expected tag '$expected_tag')."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "VERSION_SUFFIX=$suffix" >> "$GITHUB_ENV"

      # Both runtimes: packages multi-target net10.0;net8.0, so `dotnet build` compiles and
      # `dotnet test` runs every test assembly once per target framework.
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      # ContinuousIntegrationBuild normalizes the source paths embedded in the PDBs so the
      # published symbol packages are machine-independent (Source Link practice for official builds).
      - name: Build
        run: dotnet build --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      # Docker-free gate — same filter as CI. The PostgreSQL Testcontainers and RabbitMQ broker
      # tests require a container runtime and are validated outside hosted runners.
      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal --filter "Category!=RequiresDocker"

      - name: Pack
        run: dotnet pack --configuration Release --no-build --output ./artifacts -p:ContinuousIntegrationBuild=true

      # The solution packs exactly nine packages (the server host, samples, and test projects are
      # not packable). Guard the count and the version stamp so a packaging regression cannot
      # reach nuget.org.
      - name: Verify package set
        run: |
          count=$(ls artifacts/*.nupkg | wc -l)
          if [ "$count" -ne 9 ]; then
            echo "::error::Expected 9 .nupkg files, found $count:"
            ls -l artifacts/
            exit 1
          fi
          for f in artifacts/*.nupkg; do
            case "$f" in
              *".$VERSION.nupkg") ;;
              *) echo "::error::Package '$f' does not carry version $VERSION"; exit 1 ;;
            esac
          done
          ls -l artifacts/

      # The dashboard package ships a build target that warns .NET 10 consumers to set
      # RequiresAspNetWebAssets — a host property NuGet cannot supply at restore time. Assert that
      # target is actually inside the package so a packaging regression cannot drop the only safety
      # net the consumer gets.
      - name: Verify dashboard web-assets guard
        run: bash scripts/pack-content-assert.sh ./artifacts

      - name: NuGet login (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: nspukcode

      # Symbol packages (.snupkg) sitting next to the .nupkg files are pushed automatically.
      # --skip-duplicate makes re-running a partially failed job safe: already-published
      # versions are reported and skipped instead of failing the run.
      - name: Push to nuget.org
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

      - name: Upload published packages (audit artifact)
        uses: actions/upload-artifact@v7
        with:
          name: published-packages
          path: artifacts/*

      # Cut this version's section out of CHANGELOG.md for the release notes. Stops at the next
      # version heading or at the link-reference block at the bottom of the file.
      - name: Extract release notes
        run: |
          awk -v ver="$VERSION" '
            !found && index($0, "## [" ver "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[/) { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! [ -s release-notes.md ]; then
            echo "CHANGELOG section for $VERSION not found; using a pointer instead."
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)." > release-notes.md
          fi

      # Versions with a suffix (e.g. -alpha) are flagged as pre-releases; a suffix-less tag
      # becomes a normal release. Skips quietly if the release already exists (job re-runs).
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping."
            exit 0
          fi
          prerelease_flag=""
          [ -n "$VERSION_SUFFIX" ] && prerelease_flag="--prerelease"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            $prerelease_flag \
            --title "UKBatch $VERSION" \
            --notes-file release-notes.md

  # Publishes the UKBatch.Server orchestrator image to GHCR AFTER the NuGet packages are live,
  # so an image version never exists without its matching package set. Authentication is the
  # workflow's own GITHUB_TOKEN (packages: write) — no long-lived secret here either.
  docker:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      # QEMU only executes the tiny runtime-stage RUN instruction for the non-native platform;
      # the expensive SDK build stage stays native via --platform=$BUILDPLATFORM in the Dockerfile.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image tag is the semver parsed from the git tag (e.g. v0.1.4-alpha -> 0.1.4-alpha);
      # the version guard in the release job already proved it equals the package version.
      # `latest` is applied automatically only to suffix-less stable versions — semver
      # pre-releases never move it. The generated OCI labels (source/revision/version/licenses)
      # link the GHCR package back to this repository.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/ukbatch-server
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/UKBatch.Server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
