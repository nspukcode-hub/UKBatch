name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Both runtimes: packages multi-target net10.0;net8.0, so `dotnet build` compiles and
      # `dotnet test` runs every test assembly once per target framework.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Restore tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Docker-free gate — green everywhere. The EF Core adapter's PostgreSQL Testcontainers tests carry
      # [Trait("Category","RequiresDocker")] and are validated in a Docker-equipped environment;
      # they are excluded here so CI stays deterministic and does not depend on a container runtime.
      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal --filter "Category!=RequiresDocker" --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml

      # Renders the cobertura output as a coverage table on the run's Summary tab and publishes a
      # browsable HTML report artifact. Test assemblies and the non-packable server host are filtered
      # out so the numbers reflect the shipped packages. Note: RabbitMQ coverage reads low here by
      # design — its broker integration tests require Docker and are excluded from this job.
      - name: Coverage summary
        if: always()
        run: |
          dotnet reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"coverage" \
            -reporttypes:"Html;MarkdownSummaryGithub" \
            -assemblyfilters:"+UKBatch.*;-*.Tests;-UKBatch.Server" \
            -classfilters:"-*.Migrations.*"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/**

      - name: Pack (verify packable on every CI)
        run: dotnet pack --configuration Release --no-build --output ./artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
